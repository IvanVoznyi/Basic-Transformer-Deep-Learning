<defs><pattern id="hatch142" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" style="fill:var(--hatchbg)"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--hatchln);stroke-width:2.4"/></pattern><pattern id="slash142" width="7" height="7" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><rect width="7" height="7" style="fill:var(--slashbg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--slashln);stroke-width:2.2"/></pattern></defs>
<rect width="1880" height="1312" style="fill:var(--bg)"/>
<rect x="0.0" y="0.0" width="1880.0" height="96.0" rx="0" style="fill:var(--hdbg);stroke:none;stroke-width:1"/>
<rect x="0.0" y="93.0" width="1880.0" height="1.0" rx="0" style="fill:var(--hdedge);stroke:none;stroke-width:1"/>
<rect x="0.0" y="94.0" width="1880.0" height="3.0" rx="0" style="fill:var(--accent);stroke:none;stroke-width:1"/>
<text x="34.0" y="40.0" style="fill:var(--hdtag);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:600;text-anchor:start">VISION v1 · BUILDING A BIGGER DATASET · D3</text>
<text y="40.0" xml:space="preserve" style="fill:var(--hdfg);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:21px;font-weight:600"><tspan x="348.3" class="g142s0" textLength="137.3" lengthAdjust="spacing">Augmentation</tspan></text>
<text y="66.0" xml:space="preserve" style="fill:var(--hdsub);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px"><tspan x="34.0" textLength="342.5" lengthAdjust="spacing">one photo, many pictures — and what it is worth, measured</tspan></text>
<text y="85.0" xml:space="preserve" style="fill:var(--hddim);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px"><tspan x="34.0" textLength="716.5" lengthAdjust="spacing">The cheapest way to a bigger dataset: make new pictures from the ones you have. Here: the two tests trained again with all of it switched off.</tspan></text>
<rect x="34.0" y="120.0" width="1812.0" height="88.0" rx="8" class="g142s7"/>
<path d="M39.50 120.93 A7.50 7.50 0 0 0 34.50 128.00 V200.00 A7.50 7.50 0 0 0 39.50 207.07 Z" class="g142s8"/>
<text y="147.0" xml:space="preserve" style="fill:var(--ink);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600"><tspan x="54.0" class="g142s0" textLength="298.6" lengthAdjust="spacing">New pictures from old photos, labels included</tspan></text>
<text y="169.0" xml:space="preserve" class="g142s9"><tspan x="54.0" textLength="33.2" lengthAdjust="spacing">Every</tspan><tspan x="87.2"> </tspan><tspan x="91.6" textLength="42.6" lengthAdjust="spacing">change</tspan><tspan x="134.2"> </tspan><tspan x="138.6" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, 'Courier New', monospace;font-size:12.2px;font-weight:600;fill:var(--ink)" textLength="125.1" lengthAdjust="spacing">AugmentedPictures</tspan><tspan x="263.7"> </tspan><tspan x="268.1" textLength="38.3" lengthAdjust="spacing">makes</tspan><tspan x="306.4"> </tspan><tspan x="310.7" textLength="10.8" lengthAdjust="spacing">to</tspan><tspan x="321.6"> </tspan><tspan x="326.0">a</tspan><tspan x="333.2"> </tspan><tspan x="337.6" textLength="32.5" lengthAdjust="spacing">photo</tspan><tspan x="370.1"> </tspan><tspan x="374.5">—</tspan><tspan x="387.5"> </tspan><tspan x="391.9" textLength="35.4" lengthAdjust="spacing">zoom,</tspan><tspan x="427.3"> </tspan><tspan x="431.6" textLength="35.4" lengthAdjust="spacing">move,</tspan><tspan x="467.0"> </tspan><tspan x="471.4" textLength="37.5" lengthAdjust="spacing">mirror,</tspan><tspan x="509.0"> </tspan><tspan x="513.3" textLength="35.4" lengthAdjust="spacing">colour</tspan><tspan x="548.7"> </tspan><tspan x="553.1">—</tspan><tspan x="566.1"> </tspan><tspan x="570.5" textLength="9.4" lengthAdjust="spacing">is</tspan><tspan x="579.9"> </tspan><tspan x="584.3" textLength="32.5" lengthAdjust="spacing">made</tspan><tspan x="616.8"> </tspan><tspan x="621.2" textLength="10.8" lengthAdjust="spacing">to</tspan><tspan x="632.0"> </tspan><tspan x="636.4" textLength="13.0" lengthAdjust="spacing">its</tspan><tspan x="649.4"> </tspan><tspan x="653.8" textLength="31.1" lengthAdjust="spacing">mask</tspan><tspan x="684.8"> </tspan><tspan x="689.2" textLength="21.7" lengthAdjust="spacing">too,</tspan><tspan x="710.9"> </tspan><tspan x="715.3" textLength="13.7" lengthAdjust="spacing">so</tspan><tspan x="729.0"> </tspan><tspan x="733.4" textLength="28.2" lengthAdjust="spacing">each</tspan><tspan x="761.6"> </tspan><tspan x="766.0" textLength="23.8" lengthAdjust="spacing">new</tspan><tspan x="789.8"> </tspan><tspan x="794.2" textLength="39.0" lengthAdjust="spacing">picture</tspan><tspan x="833.2"> </tspan><tspan x="837.6" textLength="38.3" lengthAdjust="spacing">comes</tspan><tspan x="875.9"> </tspan><tspan x="880.2" textLength="23.1" lengthAdjust="spacing">with</tspan><tspan x="903.4"> </tspan><tspan x="907.7">a</tspan><tspan x="915.0"> </tspan><tspan x="919.3" textLength="25.3" lengthAdjust="spacing">right</tspan><tspan x="944.6"> </tspan><tspan x="949.0" textLength="41.9" lengthAdjust="spacing">answer</tspan><tspan x="990.9"> </tspan><tspan x="995.3" textLength="15.2" lengthAdjust="spacing">for</tspan><tspan x="1010.5"> </tspan><tspan x="1014.8" textLength="26.0" lengthAdjust="spacing">free.</tspan><tspan x="1040.9"> </tspan><tspan x="1045.2" textLength="7.2" lengthAdjust="spacing">It</tspan><tspan x="1052.5"> </tspan><tspan x="1056.8" textLength="45.5" lengthAdjust="spacing">teaches</tspan><tspan x="1102.4"> </tspan><tspan x="1106.8" textLength="18.1" lengthAdjust="spacing">the</tspan><tspan x="1124.8"> </tspan><tspan x="1129.2" textLength="35.4" lengthAdjust="spacing">model</tspan><tspan x="1164.6"> </tspan><tspan x="1169.0" textLength="27.5" lengthAdjust="spacing">what</tspan><tspan x="1196.4"> </tspan><tspan x="1200.8" textLength="28.2" lengthAdjust="spacing">must</tspan><tspan x="1229.0"> </tspan><tspan x="1233.4" textLength="18.1" lengthAdjust="spacing">not</tspan><tspan x="1251.4"> </tspan><tspan x="1255.8" textLength="40.5" lengthAdjust="spacing">matter:</tspan><tspan x="1296.3"> </tspan><tspan x="1300.7" textLength="35.4" lengthAdjust="spacing">where</tspan><tspan x="1336.1"> </tspan><tspan x="1340.4">a</tspan><tspan x="1347.7"> </tspan><tspan x="1352.1" textLength="39.7" lengthAdjust="spacing">person</tspan><tspan x="1391.8"> </tspan><tspan x="1396.2" textLength="41.9" lengthAdjust="spacing">stands,</tspan><tspan x="1438.1"> </tspan><tspan x="1442.5" textLength="23.8" lengthAdjust="spacing">how</tspan><tspan x="1466.3"> </tspan><tspan x="1470.7" textLength="17.3" lengthAdjust="spacing">big</tspan><tspan x="1488.0"> </tspan><tspan x="1492.4" textLength="24.6" lengthAdjust="spacing">they</tspan><tspan x="1517.0"> </tspan><tspan x="1521.4" textLength="27.5" lengthAdjust="spacing">look,</tspan><tspan x="1548.8"> </tspan><tspan x="1553.2" textLength="33.2" lengthAdjust="spacing">which</tspan><tspan x="1586.4"> </tspan><tspan x="1590.8" textLength="23.1" lengthAdjust="spacing">way</tspan><tspan x="1613.9"> </tspan><tspan x="1618.3" textLength="24.6" lengthAdjust="spacing">they</tspan><tspan x="1642.9"> </tspan><tspan x="1647.3" textLength="28.2" lengthAdjust="spacing">face,</tspan><tspan x="1675.4"> </tspan><tspan x="1679.8" textLength="23.8" lengthAdjust="spacing">how</tspan><tspan x="1703.7"> </tspan><tspan x="1708.0" textLength="32.5" lengthAdjust="spacing">bright</tspan><tspan x="1740.6"> </tspan><tspan x="1744.9" textLength="18.1" lengthAdjust="spacing">the</tspan><tspan x="1763.0"> </tspan><tspan x="1767.4" textLength="29.6" lengthAdjust="spacing">room</tspan><tspan x="1797.0"> </tspan><tspan x="1801.4" textLength="13.0" lengthAdjust="spacing">is.</tspan><tspan x="1814.4"> </tspan><tspan x="1818.8" textLength="7.2" lengthAdjust="spacing">It</tspan></text>
<text y="188.0" xml:space="preserve" class="g142s9"><tspan x="54.0" textLength="458.8" lengthAdjust="spacing">cannot teach what the photos never show: a new wall, a sitting person, daylight.</tspan></text>
<rect x="34.0" y="242.0" width="1812.0" height="30.0" rx="6" class="g142s5"/>
<path d="M38.50 242.71 A5.50 5.50 0 0 0 34.50 248.00 V266.00 A5.50 5.50 0 0 0 38.50 271.29 Z" class="g142s10"/>
<text y="262.0" xml:space="preserve" class="g142s11"><tspan x="50.0" class="g142s0" textLength="200.7" lengthAdjust="spacing">A · One batch of training pictures</tspan></text>
<text y="262.0" xml:space="preserve" class="g142s12"><tspan x="268.7" textLength="26.2" lengthAdjust="spacing">from </tspan><tspan x="294.9" class="g142s13" textLength="91.1" lengthAdjust="spacing">pictures.batch</tspan><tspan x="386.0"> (</tspan><tspan x="393.0" class="g142s1" textLength="28.5" lengthAdjust="spacing">cell 4</tspan><tspan x="421.5" textLength="167.5" lengthAdjust="spacing">): people tinted, padding hatched</tspan></text>
<image href="figs/vis_m_batch.png?v=b888e3b90b" x="34.0" y="302.0" width="1812.0" height="604.0" preserveAspectRatio="none" style="image-rendering:pixelated"/>
<rect x="34.0" y="302.0" width="1812.0" height="604.0" rx="0" class="g142s14"/>
<rect x="34.0" y="928.0" width="1812.0" height="30.0" rx="6" class="g142s5"/>
<path d="M38.50 928.71 A5.50 5.50 0 0 0 34.50 934.00 V952.00 A5.50 5.50 0 0 0 38.50 957.29 Z" class="g142s10"/>
<text y="948.0" xml:space="preserve" class="g142s11"><tspan x="50.0" class="g142s0" textLength="271.1" lengthAdjust="spacing">B · The tests, with and without augmentation</tspan></text>
<text y="948.0" xml:space="preserve" class="g142s12"><tspan x="339.1" class="g142s13" textLength="78.1" lengthAdjust="spacing">without = no</tspan><tspan x="417.2" textLength="504.3" lengthAdjust="spacing"> zoom or move, no mirror, no colour change, no copy-paste: every training picture is the photo itself</tspan></text>
<rect x="34.0" y="998.0" width="1812.0" height="24.0" rx="4" class="g142s5"/>
<text y="1014.0" xml:space="preserve" class="g142s4"><tspan x="43.0" class="g142s0" textLength="83.5" lengthAdjust="spacing">test (never seen)</tspan></text>
<text y="1014.0" xml:space="preserve" class="g142s4"><tspan x="603.0" class="g142s0" textLength="105.8" lengthAdjust="spacing">without augmentation</tspan></text>
<text y="1014.0" xml:space="preserve" class="g142s4"><tspan x="1003.0" class="g142s0" textLength="94.6" lengthAdjust="spacing">with (the notebook)</tspan></text>
<text y="1014.0" xml:space="preserve" class="g142s4"><tspan x="1403.0" class="g142s0" textLength="48.9" lengthAdjust="spacing">difference</tspan></text>
<text y="1041.2" xml:space="preserve" class="g142s6"><tspan x="43.0" class="g142s0" textLength="56.7" lengthAdjust="spacing">(a) photo </tspan><tspan x="99.7" class="g142s1">2</tspan></text>
<text x="603.0" y="1041.2" class="g142s2">58.3%</text>
<text x="1003.0" y="1041.2" class="g142s2">56.4%</text>
<text x="1403.0" y="1041.2" class="g142s2">-1.9 points</text>
<line x1="34.0" y1="1052.0" x2="1846.0" y2="1052.0" class="g142s3"/>
<rect x="34.0" y="1052.0" width="1812.0" height="30.0" rx="0" style="fill:var(--zebra);stroke:none;stroke-width:1"/>
<text y="1071.2" xml:space="preserve" class="g142s6"><tspan x="43.0" class="g142s0" textLength="56.7" lengthAdjust="spacing">(b) photo </tspan><tspan x="99.7" class="g142s1">1</tspan><tspan x="107.1" class="g142s0" textLength="51.6" lengthAdjust="spacing">, right of </tspan><tspan x="158.6" class="g142s15" textLength="56.6" lengthAdjust="spacing">x = 1330</tspan></text>
<text x="603.0" y="1071.2" class="g142s2">76.2%</text>
<text x="1003.0" y="1071.2" class="g142s2">88.3%</text>
<text x="1403.0" y="1071.2" class="g142s2">+12.1 points</text>
<line x1="34.0" y1="1082.0" x2="1846.0" y2="1082.0" class="g142s3"/>
<text y="1101.2" xml:space="preserve" class="g142s6"><tspan x="43.0" class="g142s0" textLength="56.7" lengthAdjust="spacing">(b) photo </tspan><tspan x="99.7" class="g142s1">2</tspan><tspan x="107.1" class="g142s0" textLength="51.6" lengthAdjust="spacing">, right of </tspan><tspan x="158.6" class="g142s15" textLength="56.6" lengthAdjust="spacing">x = 1352</tspan></text>
<text x="603.0" y="1101.2" class="g142s2">74.5%</text>
<text x="1003.0" y="1101.2" class="g142s2">76.1%</text>
<text x="1403.0" y="1101.2" class="g142s2">+1.6 points</text>
<line x1="34.0" y1="1112.0" x2="1846.0" y2="1112.0" class="g142s3"/>
<rect x="34.0" y="1022.0" width="1812.0" height="90.0" rx="0" class="g142s14"/>
<line x1="594.0" y1="1022.0" x2="594.0" y2="1112.0" class="g142s3"/>
<line x1="994.0" y1="1022.0" x2="994.0" y2="1112.0" class="g142s3"/>
<line x1="1394.0" y1="1022.0" x2="1394.0" y2="1112.0" class="g142s3"/>
<text y="1132.2" xml:space="preserve" class="g142s16"><tspan x="34.0" textLength="210.8" lengthAdjust="spacing">Averaged over each test’s photos: (a) </tspan><tspan x="244.8" class="g142s1" textLength="36.7" lengthAdjust="spacing">58.3%</tspan><tspan x="281.4" textLength="48.8" lengthAdjust="spacing"> without, </tspan><tspan x="330.2" class="g142s1" textLength="36.7" lengthAdjust="spacing">56.4%</tspan><tspan x="366.9" textLength="50.2" lengthAdjust="spacing"> with; (b) </tspan><tspan x="417.1" class="g142s1" textLength="36.7" lengthAdjust="spacing">75.4%</tspan><tspan x="453.7" textLength="48.8" lengthAdjust="spacing"> without, </tspan><tspan x="502.6" class="g142s1" textLength="36.7" lengthAdjust="spacing">82.2%</tspan><tspan x="539.2" textLength="430.6" lengthAdjust="spacing"> with. With augmentation, on a photo it never saw it made almost no difference (</tspan><tspan x="969.8" class="g142s1" textLength="22.3" lengthAdjust="spacing">-1.9</tspan><tspan x="992.1" textLength="232.9" lengthAdjust="spacing"> points); on people it never saw it helped (+</tspan><tspan x="1225.0" class="g142s1" textLength="18.0" lengthAdjust="spacing">6.8</tspan><tspan x="1243.0" textLength="265.1" lengthAdjust="spacing"> points). Zooming, moving and recolouring photo </tspan><tspan x="1508.1" class="g142s1">1</tspan><tspan x="1515.3" textLength="324.8" lengthAdjust="spacing"> cannot show the model a grey wall; they can show it people</tspan></text>
<text y="1149.9" xml:space="preserve" class="g142s16"><tspan x="34.0" textLength="698.4" lengthAdjust="spacing">at new sizes and places. Each number is one training run; another seed would move it a little, so read small differences with care.</tspan></text>
<rect x="34.0" y="1173.4" width="1812.0" height="55.0" rx="6" class="g142s7"/>
<path d="M38.50 1174.09 A5.50 5.50 0 0 0 34.50 1179.38 V1222.42 A5.50 5.50 0 0 0 38.50 1227.71 Z" class="g142s8"/>
<text y="1199.4" xml:space="preserve" style="fill:var(--ink);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:600"><tspan x="50.0" class="g142s0" textLength="218.5" lengthAdjust="spacing">What augmentation can and cannot do</tspan></text>
<text y="1216.9" xml:space="preserve" style="fill:var(--ink2);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px"><tspan x="50.0" textLength="1564.2" lengthAdjust="spacing">Augmentation stretches a dataset; it does not replace one. Each change must keep the label true — a mirrored person is still a person, but a picture squeezed to half its width would teach a shape people do not have. The test that matters stays the same: photos and people the model never saw.</tspan></text>
<line x1="28.0" y1="1254.4" x2="1852.0" y2="1254.4" style="stroke:var(--hair);stroke-width:1;stroke-linecap:round"/>
<text y="1271.4" xml:space="preserve" style="fill:var(--ink3);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px"><tspan x="28.0" textLength="542.3" lengthAdjust="spacing">Numbers, always labelled. Everything on this page is computed here from the two photos, their traced outlines (</tspan><tspan x="570.3" class="g142s17" textLength="68.5" lengthAdjust="spacing">labelvis.py</tspan><tspan x="638.8" textLength="211.5" lengthAdjust="spacing">) and the vision notebook run with PyTorch </tspan><tspan x="850.3" class="g142s1" textLength="16.2" lengthAdjust="spacing">2.8</tspan><tspan x="866.5" textLength="193.2" lengthAdjust="spacing">.0, trained again with augmentation off (</tspan><tspan x="1059.7" class="g142s17" textLength="56.0" lengthAdjust="spacing">expvis.py</tspan><tspan x="1115.7" textLength="6.7" lengthAdjust="spacing">).</tspan></text>
</svg>