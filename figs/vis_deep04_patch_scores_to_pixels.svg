<svg data-src="vis_deep04_patch_scores_to_pixels.svg" xmlns="http://www.w3.org/2000/svg" class="txfig" data-w="1880" data-h="1409" viewBox="0 0 1880 1409">
<style>.txfig .g150s0{font-weight:600}.txfig .g150s1{fill:var(--ink2);font-family:'DejaVu Sans Mono', Menlo, Consolas, 'Courier New', monospace;font-size:12.5px;text-anchor:start}.txfig .g150s2{font-weight:600;fill:var(--ink)}.txfig .g150s3{stroke:var(--gridline);stroke-width:0.9;stroke-linecap:round}.txfig .g150s4{fill:var(--ink2);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10.5px;font-weight:600}.txfig .g150s5{fill:none;stroke:var(--panelbd);stroke-width:1}.txfig .g150s6{font-family:'DejaVu Sans Mono', Menlo, Consolas, 'Courier New', monospace;font-size:12.2px;font-weight:600;fill:var(--ink)}.txfig .g150s7{font-family:'DejaVu Sans Mono', Menlo, Consolas, 'Courier New', monospace;font-size:10.8px;font-weight:600;fill:var(--ink)}.txfig .g150s8{fill:var(--thead);stroke:var(--panelbd);stroke-width:1}.txfig .g150s9{fill:var(--ink);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:600}.txfig .g150s10{fill:var(--ink2);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px;text-anchor:start}.txfig .g150s11{fill:var(--ink2);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:600;text-anchor:start}.txfig .g150s12{font-family:'DejaVu Sans Mono', Menlo, Consolas, 'Courier New', monospace;font-size:10.3px;font-weight:600;fill:var(--ink)}.txfig .g150s13{fill:var(--keybg);stroke:var(--keybd);stroke-width:1}.txfig .g150s14{fill:var(--keep);stroke:none}.txfig .g150s15{fill:var(--accent);stroke:none}.txfig .g150s16{fill:var(--ink);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;font-weight:600}.txfig .g150s17{fill:var(--ink3);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px}.txfig .g150s18{font-weight:600;fill:var(--ink2)}.txfig .g150s19{font-family:'DejaVu Sans Mono', Menlo, Consolas, 'Courier New', monospace;font-size:11.7px;font-weight:600;fill:var(--ink)}</style>
<defs><pattern id="hatch150" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" style="fill:var(--hatchbg)"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--hatchln);stroke-width:2.4"/></pattern><pattern id="slash150" width="7" height="7" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><rect width="7" height="7" style="fill:var(--slashbg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--slashln);stroke-width:2.2"/></pattern></defs>
