<text x="34.0" y="40.0" style="fill:var(--hdtag);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:600;text-anchor:start">VISION v1 · DEEP DIVES · Q4</text>
<text y="40.0" xml:space="preserve" style="fill:var(--hdfg);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:21px;font-weight:600"><tspan x="233.6" class="g150s0" textLength="118.8" lengthAdjust="spacing">From patch </tspan><tspan x="352.4" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, 'Courier New', monospace;font-size:19.7px;font-weight:600;fill:var(--hdfg)" textLength="71.3" lengthAdjust="spacing">scores</tspan><tspan x="423.7" class="g150s0" textLength="246.2" lengthAdjust="spacing"> to pixels: copy or blend?</tspan></text>
<text y="66.0" xml:space="preserve" style="fill:var(--hdsub);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px"><tspan x="34.0" textLength="129.9" lengthAdjust="spacing">copying each patch’s </tspan><tspan x="163.9" class="g150s6" textLength="44.1" lengthAdjust="spacing">scores</tspan><tspan x="208.1" textLength="195.8" lengthAdjust="spacing"> against blending them, measured</tspan></text>
<text y="85.0" xml:space="preserve" style="fill:var(--hddim);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px"><tspan x="34.0" textLength="159.6" lengthAdjust="spacing">Test (b)’s model with its patch </tspan><tspan x="193.6" class="g150s7" textLength="39.0" lengthAdjust="spacing">scores</tspan><tspan x="232.7" textLength="406.5" lengthAdjust="spacing"> stretched two ways, and the same notebook trained with copying from the start.</tspan></text>
<rect x="34.0" y="120.0" width="1812.0" height="69.0" rx="8" class="g150s13"/>
<path d="M39.50 120.93 A7.50 7.50 0 0 0 34.50 128.00 V181.00 A7.50 7.50 0 0 0 39.50 188.07 Z" class="g150s14"/>
<text y="147.0" xml:space="preserve" style="fill:var(--ink);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600"><tspan x="54.0" class="g150s0" textLength="117.9" lengthAdjust="spacing">Two ways to give </tspan><tspan x="171.9" class="g150s2" textLength="33.7" lengthAdjust="spacing">8 × 8</tspan><tspan x="205.6" class="g150s0" textLength="94.8" lengthAdjust="spacing"> pixels a score</tspan></text>
<text y="169.0" xml:space="preserve" style="fill:var(--ink2);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px"><tspan x="54.0" textLength="130.8" lengthAdjust="spacing">The model makes two </tspan><tspan x="184.8" class="g150s6" textLength="44.1" lengthAdjust="spacing">scores</tspan><tspan x="228.9" textLength="94.0" lengthAdjust="spacing"> per patch, on a </tspan><tspan x="322.9" class="g150s2" textLength="73.4" lengthAdjust="spacing">24 × 36 grid</tspan><tspan x="396.2" textLength="179.0" lengthAdjust="spacing">. Nearest copies each patch’s </tspan><tspan x="575.3" class="g150s6" textLength="44.1" lengthAdjust="spacing">scores</tspan><tspan x="619.4" textLength="65.8" lengthAdjust="spacing"> to all of its </tspan><tspan x="685.2" class="g150s2" textLength="15.3" lengthAdjust="spacing">64</tspan><tspan x="700.5" textLength="368.5" lengthAdjust="spacing"> pixels: every outline then runs along the patch lines, in steps of </tspan><tspan x="1069.0" class="g150s2">8</tspan><tspan x="1076.7" textLength="718.3" lengthAdjust="spacing">. Bilinear — what the notebook does — blends the four nearest patch centres, so an outline can fall anywhere between them.</tspan></text>
<rect x="34.0" y="223.0" width="1812.0" height="30.0" rx="6" class="g150s8"/>
<path d="M38.50 223.71 A5.50 5.50 0 0 0 34.50 229.00 V247.00 A5.50 5.50 0 0 0 38.50 252.29 Z" class="g150s15"/>
<text y="243.0" xml:space="preserve" class="g150s16"><tspan x="50.0" class="g150s0" textLength="142.4" lengthAdjust="spacing">A · Test (b), three ways</tspan></text>
<text y="243.0" xml:space="preserve" class="g150s17"><tspan x="210.4" textLength="38.4" lengthAdjust="spacing">person </tspan><tspan x="248.8" class="g150s7" textLength="19.5" lengthAdjust="spacing">IoU</tspan><tspan x="268.3" textLength="177.7" lengthAdjust="spacing"> on the hidden people; right on the </tspan><tspan x="446.1" class="g150s7" textLength="104.1" lengthAdjust="spacing">outline = pixels</tspan><tspan x="550.2" textLength="35.8" lengthAdjust="spacing"> within </tspan><tspan x="586.0" class="g150s2">4</tspan><tspan x="592.7" textLength="159.2" lengthAdjust="spacing"> photo pixels of a traced outline</tspan></text>
<rect x="34.0" y="279.0" width="1812.0" height="24.0" rx="4" class="g150s8"/>
<text y="295.0" xml:space="preserve" class="g150s4"><tspan x="43.0" class="g150s0" textLength="33.4" lengthAdjust="spacing">stretch</tspan></text>
<text y="295.0" xml:space="preserve" class="g150s4"><tspan x="563.0" class="g150s0" textLength="30.9" lengthAdjust="spacing">photo </tspan><tspan x="593.9" class="g150s18">1</tspan></text>
<text y="295.0" xml:space="preserve" class="g150s4"><tspan x="843.0" class="g150s0" textLength="30.9" lengthAdjust="spacing">photo </tspan><tspan x="873.9" class="g150s18">2</tspan></text>
<text y="295.0" xml:space="preserve" class="g150s4"><tspan x="1123.0" class="g150s0" textLength="40.2" lengthAdjust="spacing">average</tspan></text>
<text y="295.0" xml:space="preserve" class="g150s4"><tspan x="1403.0" class="g150s0" textLength="91.6" lengthAdjust="spacing">right on the outline</tspan></text>
<text y="322.2" xml:space="preserve" class="g150s9"><tspan x="43.0" class="g150s0" textLength="131.8" lengthAdjust="spacing">bilinear (the notebook)</tspan></text>
<text x="563.0" y="322.2" class="g150s1">88.3%</text>
<text x="843.0" y="322.2" class="g150s1">76.1%</text>
<text x="1123.0" y="322.2" class="g150s1">82.2%</text>
<text x="1403.0" y="322.2" class="g150s1">64.1%</text>
<line x1="34.0" y1="333.0" x2="1846.0" y2="333.0" class="g150s3"/>
<rect x="34.0" y="333.0" width="1812.0" height="30.0" rx="0" style="fill:var(--zebra);stroke:none;stroke-width:1"/>
<text y="352.2" xml:space="preserve" class="g150s9"><tspan x="43.0" class="g150s0" textLength="84.0" lengthAdjust="spacing">nearest at use</tspan></text>
<text x="563.0" y="352.2" class="g150s1">84.2%</text>
<text x="843.0" y="352.2" class="g150s1">73.4%</text>
<text x="1123.0" y="352.2" class="g150s1">78.8%</text>
<text x="1403.0" y="352.2" class="g150s1">57.9%</text>
<line x1="34.0" y1="363.0" x2="1846.0" y2="363.0" class="g150s3"/>
<text y="382.2" xml:space="preserve" class="g150s9"><tspan x="43.0" class="g150s0" textLength="115.6" lengthAdjust="spacing">trained with nearest</tspan></text>
<text x="563.0" y="382.2" class="g150s1">83.5%</text>
<text x="843.0" y="382.2" class="g150s1">71.4%</text>
<text x="1123.0" y="382.2" class="g150s1">77.4%</text>
<text x="1403.0" y="382.2" class="g150s1">57.5%</text>
<line x1="34.0" y1="393.0" x2="1846.0" y2="393.0" class="g150s3"/>
<rect x="34.0" y="303.0" width="1812.0" height="90.0" rx="0" class="g150s5"/>
<line x1="554.0" y1="303.0" x2="554.0" y2="393.0" class="g150s3"/>
<line x1="834.0" y1="303.0" x2="834.0" y2="393.0" class="g150s3"/>
<line x1="1114.0" y1="303.0" x2="1114.0" y2="393.0" class="g150s3"/>
<line x1="1394.0" y1="303.0" x2="1394.0" y2="393.0" class="g150s3"/>
<text y="413.4" xml:space="preserve" style="fill:var(--ink2);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.4px"><tspan x="34.0" textLength="154.2" lengthAdjust="spacing">Copying the same model’s </tspan><tspan x="188.2" class="g150s19" textLength="42.1" lengthAdjust="spacing">scores</tspan><tspan x="230.3" textLength="174.4" lengthAdjust="spacing"> instead of blending them costs </tspan><tspan x="404.7" class="g150s2" textLength="18.3" lengthAdjust="spacing">3.4</tspan><tspan x="423.0" textLength="95.1" lengthAdjust="spacing"> points of person </tspan><tspan x="518.1" class="g150s19" textLength="21.1" lengthAdjust="spacing">IoU</tspan><tspan x="539.2" textLength="340.5" lengthAdjust="spacing">. Training with copying from the start does not win them back: </tspan><tspan x="879.6" class="g150s2" textLength="37.3" lengthAdjust="spacing">77.4%</tspan><tspan x="916.9" textLength="50.3" lengthAdjust="spacing">, against </tspan><tspan x="967.2" class="g150s2" textLength="37.3" lengthAdjust="spacing">82.2%</tspan><tspan x="1004.5" textLength="344.6" lengthAdjust="spacing"> for blending. The model cannot learn its way around blocks of </tspan><tspan x="1349.1" class="g150s2" textLength="29.8" lengthAdjust="spacing">8 × 8</tspan><tspan x="1378.9">.</tspan></text>
<rect x="34.0" y="441.0" width="1812.0" height="30.0" rx="6" class="g150s8"/>
<path d="M38.50 441.69 A5.50 5.50 0 0 0 34.50 446.98 V464.98 A5.50 5.50 0 0 0 38.50 470.27 Z" class="g150s15"/>
<text y="461.0" xml:space="preserve" class="g150s16"><tspan x="50.0" class="g150s0" textLength="288.0" lengthAdjust="spacing">B · The same heads and shoulders, three ways</tspan></text>
<text y="461.0" xml:space="preserve" class="g150s17"><tspan x="356.0" textLength="89.5" lengthAdjust="spacing">the right of photo </tspan><tspan x="445.5" class="g150s2">1</tspan></text>
<rect x="34.0" y="501.0" width="12.0" height="12.0" rx="3" style="fill:#8a4bd3;stroke:none;stroke-width:1"/>
<text x="52.0" y="511.5" class="g150s10">person, found</text>
<rect x="144.0" y="501.0" width="12.0" height="12.0" rx="3" style="fill:#e67800;stroke:none;stroke-width:1"/>
<text x="162.0" y="511.5" class="g150s10">person, missed</text>
<rect x="261.5" y="501.0" width="12.0" height="12.0" rx="3" style="fill:#dc1e3c;stroke:none;stroke-width:1"/>
<text x="279.5" y="511.5" class="g150s10">background painted as person</text>
<text x="34.0" y="539.0" class="g150s11">bilinear · IoU 88.3%</text>
<image href="figs/vis_v4_bilinear.png?v=5702a27837" x="34.0" y="549.0" width="588.0" height="703.0" preserveAspectRatio="none"/>
<rect x="34.0" y="549.0" width="588.0" height="703.0" rx="0" class="g150s5"/>
<text x="646.0" y="539.0" class="g150s11">nearest at use · IoU 84.2%</text>
<image href="figs/vis_v4_nearest_at_use.png?v=8b1d56b3bb" x="646.0" y="549.0" width="588.0" height="703.0" preserveAspectRatio="none"/>
<rect x="646.0" y="549.0" width="588.0" height="703.0" rx="0" class="g150s5"/>
<text x="1258.0" y="539.0" class="g150s11">trained with nearest · IoU 83.5%</text>
<image href="figs/vis_v4_trained_with_nearest.png?v=d947ca2d57" x="1258.0" y="549.0" width="588.0" height="703.0" preserveAspectRatio="none"/>
<rect x="1258.0" y="549.0" width="588.0" height="703.0" rx="0" class="g150s5"/>
<rect x="34.0" y="1270.0" width="1812.0" height="55.0" rx="6" class="g150s13"/>
<path d="M38.50 1270.73 A5.50 5.50 0 0 0 34.50 1276.02 V1319.06 A5.50 5.50 0 0 0 38.50 1324.35 Z" class="g150s14"/>
<text y="1296.0" xml:space="preserve" style="fill:var(--ink);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:600"><tspan x="50.0" class="g150s0" textLength="177.5" lengthAdjust="spacing">The cheapest gain in the model</tspan></text>
<text y="1313.5" xml:space="preserve" style="fill:var(--ink2);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px"><tspan x="50.0" textLength="1062.5" lengthAdjust="spacing">Bilinear blending costs nothing to learn — it has no weights — and it is where the outlines get their shape. Better decoders go further: they learn the stretch, or bring back detail from earlier layers. This </tspan><tspan x="1112.5" style="font-family:'DejaVu Sans Mono', Menlo, Consolas, 'Courier New', monospace;font-size:11.3px;font-weight:600;fill:var(--ink)" textLength="13.6" lengthAdjust="spacing">v1</tspan><tspan x="1126.1" textLength="187.4" lengthAdjust="spacing"> keeps the simplest one that works.</tspan></text>
<line x1="28.0" y1="1351.1" x2="1852.0" y2="1351.1" style="stroke:var(--hair);stroke-width:1;stroke-linecap:round"/>
<text y="1368.1" xml:space="preserve" style="fill:var(--ink3);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px"><tspan x="28.0" textLength="461.6" lengthAdjust="spacing">Numbers, always labelled. Everything on this page comes from the vision notebook (written by </tspan><tspan x="489.6" class="g150s12" textLength="49.8" lengthAdjust="spacing">nbvis.py</tspan><tspan x="539.4" textLength="265.9" lengthAdjust="spacing">; your notebooks are only read) run here with PyTorch </tspan><tspan x="805.3" class="g150s2" textLength="16.2" lengthAdjust="spacing">2.8</tspan><tspan x="821.5" textLength="304.3" lengthAdjust="spacing">.0 on this Mac’s GPU — trained again with one line changed (</tspan><tspan x="1125.9" class="g150s12" textLength="56.0" lengthAdjust="spacing">expvis.py</tspan><tspan x="1181.9" textLength="108.8" lengthAdjust="spacing">) — and measured by </tspan><tspan x="1290.7" class="g150s12" textLength="62.2" lengthAdjust="spacing">deepvis.py</tspan><tspan x="1353.0" textLength="165.1" lengthAdjust="spacing">. Each number is one training run.</tspan></text>
</svg>