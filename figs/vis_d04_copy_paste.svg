<defs><pattern id="hatch133" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" style="fill:var(--hatchbg)"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:var(--hatchln);stroke-width:2.4"/></pattern><pattern id="slash133" width="7" height="7" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse"><rect width="7" height="7" style="fill:var(--slashbg)"/><line x1="0" y1="0" x2="0" y2="7" style="stroke:var(--slashln);stroke-width:2.2"/></pattern></defs>
<rect width="1880" height="1441" style="fill:var(--bg)"/>
<rect x="0.0" y="0.0" width="1880.0" height="96.0" rx="0" style="fill:var(--hdbg);stroke:none;stroke-width:1"/>
<rect x="0.0" y="93.0" width="1880.0" height="1.0" rx="0" style="fill:var(--hdedge);stroke:none;stroke-width:1"/>
<rect x="0.0" y="94.0" width="1880.0" height="3.0" rx="0" style="fill:var(--accent);stroke:none;stroke-width:1"/>
<text x="34.0" y="40.0" style="fill:var(--hdtag);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:600;text-anchor:start">VISION v1 · BUILDING A BIGGER DATASET · D4</text>
<text y="40.0" xml:space="preserve" style="fill:var(--hdfg);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:21px;font-weight:600"><tspan x="348.3" class="g133s0" textLength="113.8" lengthAdjust="spacing">Copy-paste</tspan></text>
<text y="66.0" xml:space="preserve" style="fill:var(--hdsub);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px"><tspan x="34.0" textLength="338.2" lengthAdjust="spacing">people moved between photos, labels and all — measured</tspan></text>
<text y="85.0" xml:space="preserve" style="fill:var(--hddim);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px"><tspan x="34.0" textLength="829.1" lengthAdjust="spacing">An augmentation made for segmentation: the traced people are cut out and pasted into other pictures, onto walls and floors they were never photographed against.</tspan></text>
<rect x="34.0" y="120.0" width="1812.0" height="69.0" rx="8" class="g133s11"/>
<path d="M39.50 120.93 A7.50 7.50 0 0 0 34.50 128.00 V181.00 A7.50 7.50 0 0 0 39.50 188.07 Z" class="g133s12"/>
<text y="147.0" xml:space="preserve" style="fill:var(--ink);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600"><tspan x="54.0" class="g133s0" textLength="207.0" lengthAdjust="spacing">Every traced person is a sticker</tspan></text>
<text y="169.0" xml:space="preserve" style="fill:var(--ink2);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px"><tspan x="54.0" textLength="1557.2" lengthAdjust="spacing">A mask says exactly which pixels are a person, so the person can be cut out along it and pasted anywhere: into the other photo, half outside the picture, in front of someone. The label is pasted with them. Fourteen traced people become any number of new arrangements.</tspan></text>
<rect x="34.0" y="223.0" width="1812.0" height="30.0" rx="6" class="g133s7"/>
<path d="M38.50 223.71 A5.50 5.50 0 0 0 34.50 229.00 V247.00 A5.50 5.50 0 0 0 38.50 252.29 Z" class="g133s13"/>
<text y="243.0" xml:space="preserve" class="g133s14"><tspan x="50.0" class="g133s0" textLength="343.1" lengthAdjust="spacing">A · The same pictures, without and with a pasted person</tspan></text>
<text y="243.0" xml:space="preserve" class="g133s15"><tspan x="411.1" class="g133s16" textLength="91.1" lengthAdjust="spacing">pictures.batch</tspan><tspan x="502.2" textLength="335.6" lengthAdjust="spacing"> with the same random numbers twice; the pasted person outlined</tspan></text>
<image href="figs/vis_m_paste_0_off.png?v=5470689fc2" x="34.0" y="283.0" width="556.7" height="371.1" preserveAspectRatio="none" class="g133s5"/>
<rect x="34.0" y="283.0" width="556.7" height="371.1" rx="0" class="g133s4"/>
<image href="figs/vis_m_paste_0_on.png?v=4eca712c80" x="600.7" y="283.0" width="556.7" height="371.1" preserveAspectRatio="none" class="g133s5"/>
<rect x="600.7" y="283.0" width="556.7" height="371.1" rx="0" class="g133s4"/>
<image href="figs/vis_m_paste_1_off.png?v=40cdde65cd" x="34.0" y="664.1" width="556.7" height="371.1" preserveAspectRatio="none" class="g133s5"/>
<rect x="34.0" y="664.1" width="556.7" height="371.1" rx="0" class="g133s4"/>
<image href="figs/vis_m_paste_1_on.png?v=d5689a502f" x="600.7" y="664.1" width="556.7" height="371.1" preserveAspectRatio="none" class="g133s5"/>
<rect x="600.7" y="664.1" width="556.7" height="371.1" rx="0" class="g133s4"/>
<text y="299.5" xml:space="preserve" class="g133s8"><tspan x="1187.4" class="g133s1" textLength="30.9" lengthAdjust="spacing">cell 4</tspan><tspan x="1218.4" textLength="291.8" lengthAdjust="spacing"> keeps every person training may see in CUTOUTS: </tspan><tspan x="1510.1" class="g133s1" textLength="14.7" lengthAdjust="spacing">14</tspan><tspan x="1524.9" textLength="319.6" lengthAdjust="spacing"> with both photos. For each picture one is picked, zoomed</tspan></text>
<text y="317.6" xml:space="preserve" class="g133s8"><tspan x="1187.4" class="g133s1" textLength="18.4" lengthAdjust="spacing">0.5</tspan><tspan x="1205.9">–</tspan><tspan x="1212.1" class="g133s1" textLength="18.4" lengthAdjust="spacing">1.4</tspan><tspan x="1230.5" textLength="287.5" lengthAdjust="spacing"> ×, mirrored half the time and dropped anywhere; in </tspan><tspan x="1518.0" class="g133s1" textLength="26.5" lengthAdjust="spacing">50%</tspan><tspan x="1544.5" textLength="89.6" lengthAdjust="spacing"> of the pictures (</tspan><tspan x="1634.2" class="g133s9" textLength="70.7" lengthAdjust="spacing">PASTE_PROB</tspan><tspan x="1704.9" textLength="116.7" lengthAdjust="spacing">) it is kept. In test (a),</tspan></text>
<text y="335.8" xml:space="preserve" class="g133s8"><tspan x="1187.4" textLength="93.8" lengthAdjust="spacing">trained on photo </tspan><tspan x="1281.3" class="g133s1">1</tspan><tspan x="1288.6" textLength="161.9" lengthAdjust="spacing"> alone, the cutouts are photo </tspan><tspan x="1450.5" class="g133s1">1</tspan><tspan x="1457.9" textLength="121.4" lengthAdjust="spacing">’s seven people only.</tspan></text>
<rect x="34.0" y="1057.3" width="1812.0" height="30.0" rx="6" class="g133s7"/>
<path d="M38.50 1058.00 A5.50 5.50 0 0 0 34.50 1063.29 V1081.29 A5.50 5.50 0 0 0 38.50 1086.58 Z" class="g133s13"/>
<text y="1077.3" xml:space="preserve" class="g133s14"><tspan x="50.0" class="g133s0" textLength="255.1" lengthAdjust="spacing">B · The tests, with and without copy-paste</tspan></text>
<text y="1077.3" xml:space="preserve" class="g133s15"><tspan x="323.1" class="g133s16" textLength="130.2" lengthAdjust="spacing">without = PASTE_PROB</tspan><tspan x="453.2"> </tspan><tspan x="456.4" class="g133s1" textLength="16.9" lengthAdjust="spacing">0.0</tspan><tspan x="473.3" textLength="134.2" lengthAdjust="spacing">, everything else the same</tspan></text>
<rect x="34.0" y="1127.3" width="1812.0" height="24.0" rx="4" class="g133s7"/>
<text y="1143.3" xml:space="preserve" class="g133s6"><tspan x="43.0" class="g133s0" textLength="83.5" lengthAdjust="spacing">test (never seen)</tspan></text>
<text y="1143.3" xml:space="preserve" class="g133s6"><tspan x="603.0" class="g133s0" textLength="92.8" lengthAdjust="spacing">without copy-paste</tspan></text>
<text y="1143.3" xml:space="preserve" class="g133s6"><tspan x="1003.0" class="g133s0" textLength="94.6" lengthAdjust="spacing">with (the notebook)</tspan></text>
<text y="1143.3" xml:space="preserve" class="g133s6"><tspan x="1403.0" class="g133s0" textLength="48.9" lengthAdjust="spacing">difference</tspan></text>
<text y="1170.5" xml:space="preserve" class="g133s10"><tspan x="43.0" class="g133s0" textLength="56.7" lengthAdjust="spacing">(a) photo </tspan><tspan x="99.7" class="g133s1">2</tspan></text>
<text x="603.0" y="1170.5" class="g133s2">48.6%</text>
<text x="1003.0" y="1170.5" class="g133s2">56.4%</text>
<text x="1403.0" y="1170.5" class="g133s2">+7.8 points</text>
<line x1="34.0" y1="1181.3" x2="1846.0" y2="1181.3" class="g133s3"/>
<rect x="34.0" y="1181.3" width="1812.0" height="30.0" rx="0" style="fill:var(--zebra);stroke:none;stroke-width:1"/>
<text y="1200.5" xml:space="preserve" class="g133s10"><tspan x="43.0" class="g133s0" textLength="56.7" lengthAdjust="spacing">(b) photo </tspan><tspan x="99.7" class="g133s1">1</tspan><tspan x="107.1" class="g133s0" textLength="51.6" lengthAdjust="spacing">, right of </tspan><tspan x="158.6" class="g133s9" textLength="56.6" lengthAdjust="spacing">x = 1330</tspan></text>
<text x="603.0" y="1200.5" class="g133s2">90.4%</text>
<text x="1003.0" y="1200.5" class="g133s2">88.3%</text>
<text x="1403.0" y="1200.5" class="g133s2">-2.1 points</text>
<line x1="34.0" y1="1211.3" x2="1846.0" y2="1211.3" class="g133s3"/>
<text y="1230.5" xml:space="preserve" class="g133s10"><tspan x="43.0" class="g133s0" textLength="56.7" lengthAdjust="spacing">(b) photo </tspan><tspan x="99.7" class="g133s1">2</tspan><tspan x="107.1" class="g133s0" textLength="51.6" lengthAdjust="spacing">, right of </tspan><tspan x="158.6" class="g133s9" textLength="56.6" lengthAdjust="spacing">x = 1352</tspan></text>
<text x="603.0" y="1230.5" class="g133s2">74.4%</text>
<text x="1003.0" y="1230.5" class="g133s2">76.1%</text>
<text x="1403.0" y="1230.5" class="g133s2">+1.7 points</text>
<line x1="34.0" y1="1241.3" x2="1846.0" y2="1241.3" class="g133s3"/>
<rect x="34.0" y="1151.3" width="1812.0" height="90.0" rx="0" class="g133s4"/>
<line x1="594.0" y1="1151.3" x2="594.0" y2="1241.3" class="g133s3"/>
<line x1="994.0" y1="1151.3" x2="994.0" y2="1241.3" class="g133s3"/>
<line x1="1394.0" y1="1151.3" x2="1394.0" y2="1241.3" class="g133s3"/>
<text y="1261.5" xml:space="preserve" style="fill:var(--ink2);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12.2px"><tspan x="34.0" textLength="284.5" lengthAdjust="spacing">With copy-paste, on a photo it never saw it helped (+</tspan><tspan x="318.5" class="g133s1" textLength="18.0" lengthAdjust="spacing">7.8</tspan><tspan x="336.4" textLength="332.9" lengthAdjust="spacing"> points); on people it never saw it made almost no difference (</tspan><tspan x="669.4" class="g133s1" textLength="22.3" lengthAdjust="spacing">-0.2</tspan><tspan x="691.7" textLength="401.4" lengthAdjust="spacing"> points). Each number is one training run; read small differences with care.</tspan></text>
<rect x="34.0" y="1285.0" width="1812.0" height="72.6" rx="6" class="g133s11"/>
<path d="M38.50 1285.69 A5.50 5.50 0 0 0 34.50 1290.98 V1351.54 A5.50 5.50 0 0 0 38.50 1356.83 Z" class="g133s12"/>
<text y="1311.0" xml:space="preserve" style="fill:var(--ink);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:600"><tspan x="50.0" class="g133s0" textLength="137.1" lengthAdjust="spacing">Where copy-paste stops</tspan></text>
<text y="1328.5" xml:space="preserve" class="g133s17"><tspan x="50.0" textLength="1760.3" lengthAdjust="spacing">A pasted person keeps the light of the room they were photographed in, and their outline is only as good as the tracing: pasted onto a different wall, the edge can look cut out. Models can learn that edge as a clue. Pasting works best when the people come from many photos and land on many backgrounds — with two photos, it can</tspan></text>
<text y="1346.0" xml:space="preserve" class="g133s17"><tspan x="50.0" textLength="146.1" lengthAdjust="spacing">only reshuffle what is there.</tspan></text>
<line x1="28.0" y1="1383.5" x2="1852.0" y2="1383.5" style="stroke:var(--hair);stroke-width:1;stroke-linecap:round"/>
<text y="1400.5" xml:space="preserve" style="fill:var(--ink3);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px"><tspan x="28.0" textLength="542.3" lengthAdjust="spacing">Numbers, always labelled. Everything on this page is computed here from the two photos, their traced outlines (</tspan><tspan x="570.3" class="g133s18" textLength="68.5" lengthAdjust="spacing">labelvis.py</tspan><tspan x="638.8" textLength="211.5" lengthAdjust="spacing">) and the vision notebook run with PyTorch </tspan><tspan x="850.3" class="g133s1" textLength="16.2" lengthAdjust="spacing">2.8</tspan><tspan x="866.5" textLength="180.4" lengthAdjust="spacing">.0, trained again with copy-paste off (</tspan><tspan x="1046.9" class="g133s18" textLength="56.0" lengthAdjust="spacing">expvis.py</tspan><tspan x="1102.9" textLength="6.7" lengthAdjust="spacing">).</tspan></text>
</svg>