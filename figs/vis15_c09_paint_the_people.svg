<text x="34.0" y="40.0" style="fill:var(--hdtag);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;font-weight:600;text-anchor:start">VISION v1.5 · CELL 9 / 10</text>
<text y="40.0" xml:space="preserve" style="fill:var(--hdfg);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:21px;font-weight:600"><tspan x="206.4" class="g137s3" textLength="280.9" lengthAdjust="spacing">Predictions: paint the people</tspan></text>
<text y="66.0" xml:space="preserve" style="fill:var(--hdsub);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px"><tspan x="34.0" class="g137s1" textLength="95.6" lengthAdjust="spacing">segment_photo</tspan><tspan x="129.6" textLength="318.0" lengthAdjust="spacing">, on both photos — and on the photo test (a) never saw</tspan></text>
<text y="85.0" xml:space="preserve" style="fill:var(--hddim);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11.5px"><tspan x="34.0" class="g137s0" textLength="31.2" lengthAdjust="spacing">Cell 9</tspan><tspan x="65.2" textLength="14.7" lengthAdjust="spacing"> is </tspan><tspan x="79.9" class="g137s4" textLength="13.0" lengthAdjust="spacing">v1</tspan><tspan x="92.9" textLength="209.5" lengthAdjust="spacing">’s line for line; the model it paints with is </tspan><tspan x="302.4" class="g137s4" textLength="26.0" lengthAdjust="spacing">v1.5</tspan><tspan x="328.4" textLength="224.7" lengthAdjust="spacing">’s. Every painting is at the photo’s full size.</tspan></text>
<rect x="34.0" y="120.0" width="1812.0" height="69.0" rx="8" style="fill:var(--keybg);stroke:var(--keybd);stroke-width:1"/>
<path d="M39.50 120.93 A7.50 7.50 0 0 0 34.50 128.00 V181.00 A7.50 7.50 0 0 0 39.50 188.07 Z" style="fill:var(--keep);stroke:none"/>
<text y="147.0" xml:space="preserve" style="fill:var(--ink);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:600"><tspan x="54.0" class="g137s3" textLength="240.9" lengthAdjust="spacing">The same function, a different model</tspan></text>
<text y="169.0" xml:space="preserve" style="fill:var(--ink2);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px"><tspan x="54.0" class="g137s1" textLength="95.6" lengthAdjust="spacing">segment_photo</tspan><tspan x="149.6" textLength="374.2" lengthAdjust="spacing"> letterboxes the photo into the model’s picture, takes the person </tspan><tspan x="523.8" class="g137s1" textLength="44.1" lengthAdjust="spacing">scores</tspan><tspan x="567.9" textLength="626.3" lengthAdjust="spacing">, stretches them back to the photo’s size and paints the pixels where person wins. Only the model changed: </tspan><tspan x="1194.3" class="g137s1" textLength="29.4" lengthAdjust="spacing">v1.5</tspan><tspan x="1223.7" textLength="17.9" lengthAdjust="spacing">’s </tspan><tspan x="1241.6" class="g137s1" textLength="44.1" lengthAdjust="spacing">scores</tspan><tspan x="1285.7" textLength="68.6" lengthAdjust="spacing"> come from </tspan><tspan x="1354.4" class="g137s0" textLength="62.6" lengthAdjust="spacing">4 × 4 cells</tspan><tspan x="1417.0" textLength="268.1" lengthAdjust="spacing">, so the paint follows the outlines more closely.</tspan></text>
<rect x="34.0" y="209.0" width="1812.0" height="30.0" rx="6" class="g137s7"/>
<path d="M38.50 209.71 A5.50 5.50 0 0 0 34.50 215.00 V233.00 A5.50 5.50 0 0 0 38.50 238.29 Z" class="g137s8"/>
<text y="229.0" xml:space="preserve" class="g137s9"><tspan x="50.0" class="g137s3" textLength="169.3" lengthAdjust="spacing">A · Both photos, painted by </tspan><tspan x="219.3" class="g137s1" textLength="29.4" lengthAdjust="spacing">v1.5</tspan></text>
<text y="229.0" xml:space="preserve" class="g137s10"><tspan x="266.7" textLength="203.9" lengthAdjust="spacing">the final model — it learned both (test c)</tspan></text>
<text x="34.0" y="285.0" class="g137s5">photo 1 · person IoU 97.5%</text>
<image href="figs/vis15_s_painted.jpg?v=3feea7f42c" x="34.0" y="295.0" width="895.0" height="596.7" preserveAspectRatio="none"/>
<rect x="34.0" y="295.0" width="895.0" height="596.7" rx="0" class="g137s6"/>
<text x="951.0" y="285.0" class="g137s5">photo 2 · person IoU 97.2%</text>
<image href="figs/vis15_s_painted_2.jpg?v=7a0bf6f1b0" x="951.0" y="295.0" width="895.0" height="596.7" preserveAspectRatio="none"/>
<rect x="951.0" y="295.0" width="895.0" height="596.7" rx="0" class="g137s6"/>
<rect x="34.0" y="915.7" width="1812.0" height="30.0" rx="6" class="g137s7"/>
<path d="M38.50 916.38 A5.50 5.50 0 0 0 34.50 921.67 V939.67 A5.50 5.50 0 0 0 38.50 944.96 Z" class="g137s8"/>
<text y="935.7" xml:space="preserve" class="g137s9"><tspan x="50.0" class="g137s3" textLength="60.5" lengthAdjust="spacing">B · Photo </tspan><tspan x="110.5" class="g137s0">2</tspan><tspan x="118.2" class="g137s3" textLength="75.8" lengthAdjust="spacing">, never seen</tspan></text>
<text y="935.7" xml:space="preserve" class="g137s10"><tspan x="212.0" textLength="191.1" lengthAdjust="spacing">test (a): each model trained on photo </tspan><tspan x="403.1" class="g137s0">1</tspan><tspan x="409.9" textLength="170.1" lengthAdjust="spacing"> alone, then asked to paint photo </tspan><tspan x="580.0" class="g137s0">2</tspan><tspan x="586.8"> — </tspan><tspan x="604.7" class="g137s4" textLength="13.0" lengthAdjust="spacing">v1</tspan><tspan x="617.7" textLength="24.9" lengthAdjust="spacing"> left, </tspan><tspan x="642.6" class="g137s4" textLength="26.0" lengthAdjust="spacing">v1.5</tspan><tspan x="668.6" textLength="25.6" lengthAdjust="spacing"> right</tspan></text>
<text x="34.0" y="991.7" class="g137s5">Vision v1 · person IoU 56.4%</text>
<image href="figs/vis15_m_a2_v1.jpg?v=3dafc7fd49" x="34.0" y="1001.7" width="895.0" height="596.7" preserveAspectRatio="none"/>
<rect x="34.0" y="1001.7" width="895.0" height="596.7" rx="0" class="g137s6"/>
<text x="951.0" y="991.7" class="g137s5">Vision v1.5 · person IoU 59.8%</text>
<image href="figs/vis15_m_a2_v15.jpg?v=af9b5f9e52" x="951.0" y="1001.7" width="895.0" height="596.7" preserveAspectRatio="none"/>
<rect x="951.0" y="1001.7" width="895.0" height="596.7" rx="0" class="g137s6"/>
<text y="1626.5" xml:space="preserve" class="g137s11"><tspan x="34.0" textLength="522.8" lengthAdjust="spacing">On the photo it never saw, both models still paint much of the wall as person — the wall of photo </tspan><tspan x="556.8" class="g137s0">2</tspan><tspan x="564.0" textLength="161.4" lengthAdjust="spacing"> is a different grey, and photo </tspan><tspan x="725.4" class="g137s0">1</tspan><tspan x="732.6" textLength="161.4" lengthAdjust="spacing"> taught them nothing about it. </tspan><tspan x="894.0" class="g137s12" textLength="27.6" lengthAdjust="spacing">v1.5</tspan><tspan x="921.6" textLength="263.7" lengthAdjust="spacing">’s paint keeps closer to the people (background </tspan><tspan x="1185.3" class="g137s12" textLength="20.7" lengthAdjust="spacing">IoU</tspan><tspan x="1206.0"> </tspan><tspan x="1209.4" class="g137s0" textLength="36.7" lengthAdjust="spacing">56.0%</tspan><tspan x="1246.1" textLength="46.1" lengthAdjust="spacing"> against </tspan><tspan x="1292.2" class="g137s0" textLength="36.7" lengthAdjust="spacing">52.6%</tspan><tspan x="1328.8" textLength="516.7" lengthAdjust="spacing">) and finds a little more of them; it does not know the wall either. More photos, not a finer model,</tspan></text>
<text y="1644.2" xml:space="preserve" class="g137s11"><tspan x="34.0" textLength="93.6" lengthAdjust="spacing">is what fixes that.</tspan></text>
<line x1="28.0" y1="1673.9" x2="1852.0" y2="1673.9" style="stroke:var(--hair);stroke-width:1;stroke-linecap:round"/>
<text y="1690.9" xml:space="preserve" style="fill:var(--ink3);font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:11px"><tspan x="28.0" textLength="361.3" lengthAdjust="spacing">Numbers, always labelled. Everything on this page comes from the Vision </tspan><tspan x="389.3" class="g137s2" textLength="24.9" lengthAdjust="spacing">v1.5</tspan><tspan x="414.2" textLength="105.2" lengthAdjust="spacing"> notebook (written by </tspan><tspan x="519.4" class="g137s2" textLength="62.2" lengthAdjust="spacing">nbvis15.py</tspan><tspan x="581.6" textLength="265.9" lengthAdjust="spacing">; your notebooks are only read) run here with PyTorch </tspan><tspan x="847.6" class="g137s0" textLength="16.2" lengthAdjust="spacing">2.8</tspan><tspan x="863.8" textLength="196.7" lengthAdjust="spacing">.0 on this Mac’s GPU: its recorded run (</tspan><tspan x="1060.5" class="g137s2" textLength="68.5" lengthAdjust="spacing">runvis15.py</tspan><tspan x="1129.0" textLength="151.0" lengthAdjust="spacing">), and test (a) trained on photo </tspan><tspan x="1280.0" class="g137s0">1</tspan><tspan x="1286.5" textLength="36.7" lengthAdjust="spacing"> alone (</tspan><tspan x="1323.2" class="g137s2" textLength="68.5" lengthAdjust="spacing">expvis15.py</tspan><tspan x="1391.6" textLength="28.1" lengthAdjust="spacing">); the </tspan><tspan x="1419.8" class="g137s2" textLength="12.4" lengthAdjust="spacing">v1</tspan><tspan x="1432.2" textLength="136.9" lengthAdjust="spacing"> numbers beside them from </tspan><tspan x="1569.1" class="g137s2" textLength="12.4" lengthAdjust="spacing">v1</tspan><tspan x="1581.6" textLength="62.8" lengthAdjust="spacing">’s own runs.</tspan></text>
</svg>